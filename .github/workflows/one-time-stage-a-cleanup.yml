name: One-time Stage A cleanup

on:
  push:
    branches:
      - agent/stage-a-anisotropic-validation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Stage A cleanup retry'
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-a-anisotropic-validation
          fetch-depth: 0

      - name: Apply cleanup patch
        run: python3 .github/scripts/patch_stage_a_cleanup.py

      - name: Verify textual replacements
        shell: bash
        run: |
          python3 -m py_compile src/tests/stage_a_acceptance.py
          ! grep -F "Foam::sin(0.271*(dirI + 1)*(celli + 1) + 0.5);" src/validateFrozenGradient.H
          grep -F "relative flux error=" src/tests/stage_a_acceptance.py
          test "$(grep -F -c "partitionInvariantFDValue(celli, dirI);" src/validateFrozenGradient.H)" -eq 2

      - name: Commit and push cleanup
        shell: bash
        run: |
          git config user.name "Stage A cleanup"
          git config user.email "stage-a-cleanup@users.noreply.github.com"
          git add -- src/tests/stage_a_acceptance.py src/validateFrozenGradient.H
          git commit -m "Make Stage A diagnostics partition invariant"
          git push origin HEAD:agent/stage-a-anisotropic-validation
